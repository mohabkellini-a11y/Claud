    <section class="section contact" id="contact">
      <div class="container contact-grid">
        <div class="contact-copy reveal">
          <h2>Let's talk about your next project</h2>
          <p>Send plans or a short project summary and we'll get you a clear, fixed-fee proposal, usually within one business day.</p>
          <div class="contact-methods">
            <a class="contact-method" href="tel:+13868374057">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z"/></svg>
              <span><small>Call</small>386-837-4057</span>
            </a>
            <a class="contact-method" href="mailto:info@eversafe-fire.com">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
              <span><small>Email</small>info@eversafe-fire.com</span>
            </a>
            <a class="contact-method" href="https://www.linkedin.com/company/eversafefire/" target="_blank" rel="noopener noreferrer" aria-label="EverSafe Fire Protection on LinkedIn">
              <svg class="ico-linkedin" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
              <span><small>LinkedIn</small>EverSafe Fire Protection</span>
            </a>
            <div class="contact-method static">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
              <span><small>Serving</small>Central Florida &amp; Statewide</span>
            </div>
          </div>
        </div>

        <form class="contact-form reveal" id="contactForm" action="https://formsubmit.co/info@eversafe-fire.com" method="POST">
          <input type="hidden" name="_subject" value="New proposal request — EverSafe Fire Protection" />
          <input type="hidden" name="_template" value="table" />
          <input type="hidden" name="_captcha" value="true" />
          <input type="hidden" name="_next" value="https://eversafe-fire.com/thank-you" />
          <input type="hidden" name="_autoresponse" value="Thanks for reaching out to EverSafe Fire Protection. We've got your request and will follow up with a fixed-fee proposal, usually within one business day. Need us sooner? Call 386-837-4057. — EverSafe Fire Protection" />
          <div class="field">
            <label for="cf-name">Name</label>
            <input type="text" id="cf-name" name="name" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="cf-email">Email</label>
            <input type="email" id="cf-email" name="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="cf-phone">Phone</label>
            <input type="tel" id="cf-phone" name="phone" autocomplete="tel" inputmode="tel" required />
          </div>
          <div class="field">
            <label for="cf-message">Project details <span class="optional">(optional)</span></label>
            <textarea id="cf-message" name="message" rows="4" placeholder="Occupancy type, scope, location, timeline…"></textarea>
          </div>
          <!-- Spam honeypot: real users leave this empty -->
          <input type="text" name="_honey" style="display:none" />
          <button type="submit" class="btn btn-flame btn-block" id="cfSubmit">Request a Proposal</button>
        </form>
      </div>
    </section>
