<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 118" role="img" aria-label="EverSafe shield and flame">
  <defs>
    <linearGradient id="blueHalf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a5a97"/><stop offset="1" stop-color="#012f56"/>
    </linearGradient>
    <linearGradient id="redHalf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e11d34"/><stop offset="1" stop-color="#9e0820"/>
    </linearGradient>
    <linearGradient id="flameG" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#c30a2b"/>
      <stop offset="0.42" stop-color="#e8461a"/>
      <stop offset="0.78" stop-color="#f5901e"/>
      <stop offset="1" stop-color="#ffd23e"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#e8461a"/>
      <stop offset="0.55" stop-color="#f9a11b"/>
      <stop offset="1" stop-color="#ffe15a"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M50 3 L95 19 V63 C95 91 75 108 50 116 C25 108 5 91 5 63 V19 Z"/>
    </clipPath>
  </defs>

  <!-- shield split halves -->
  <g clip-path="url(#shieldClip)">
    <rect x="0" y="0" width="50" height="118" fill="url(#blueHalf)"/>
    <rect x="50" y="0" width="50" height="118" fill="url(#redHalf)"/>
  </g>

  <!-- outer white edge + inner bevel -->
  <path d="M50 3 L95 19 V63 C95 91 75 108 50 116 C25 108 5 91 5 63 V19 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M50 10 L89 24 V63 C89 87 71 102 50 109 C29 102 11 87 11 63 V24 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- flame (white stroke creates the carved separation) -->
  <path d="M48 29 C52 41 61 48 61 61 C61 75 52 85 44 85 C34 85 29 77 29 68 C29 61 33 57 37 53 C38 58 41 59 43 55 C45 49 41 42 46 35 C46 40 49 43 51 41 C53 38 51 33 48 29 Z"
        fill="url(#flameG)" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M46 50 C49 57 53 61 51 69 C50 76 44 79 40 76 C36 73 36 67 39 63 C40 66 42 66 43 63 C44 59 43 54 46 50 Z"
        fill="url(#flameInner)"/>
</svg>
