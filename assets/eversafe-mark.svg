<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 118" role="img" aria-label="EverSafe shield and flame">
  <defs>
    <linearGradient id="blueHalf" x1="0.15" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1668a6"/><stop offset="0.55" stop-color="#084a86"/><stop offset="1" stop-color="#012a4f"/>
    </linearGradient>
    <linearGradient id="redHalf" x1="0.85" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#e8203a"/><stop offset="0.55" stop-color="#c30a2b"/><stop offset="1" stop-color="#8f0a1f"/>
    </linearGradient>
    <linearGradient id="flameG" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#a80c1f"/>
      <stop offset="0.3" stop-color="#d61f22"/>
      <stop offset="0.62" stop-color="#f26a17"/>
      <stop offset="0.85" stop-color="#f9a41b"/>
      <stop offset="1" stop-color="#ffd645"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#e8461a"/>
      <stop offset="0.5" stop-color="#f9a11b"/>
      <stop offset="1" stop-color="#ffe45f"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M50 3 L95 19 V63 C95 91 75 108 50 116 C25 108 5 91 5 63 V19 Z"/>
    </clipPath>
  </defs>

  <!-- shield split halves -->
  <g clip-path="url(#shieldClip)">
    <rect x="0" y="0" width="50" height="118" fill="url(#blueHalf)"/>
    <rect x="50" y="0" width="50" height="118" fill="url(#redHalf)"/>
  </g>

  <!-- outer white edge + inner bevel -->
  <path d="M50 3 L95 19 V63 C95 91 75 108 50 116 C25 108 5 91 5 63 V19 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M50 10 L89 24 V63 C89 87 71 102 50 109 C29 102 11 87 11 63 V24 Z"
        fill="none" stroke="#dfe9f3" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- flame: white stroke creates the carved separation -->
  <path class="flame-path" d="M49 25 C47 33 49 38 52 37 C55 46 62 52 62 63 C62 77 53 88 44 87 C33 87 28 78 29 68 C30 59 36 55 40 50 C41 56 44 57 45 52 C46 45 42 38 46 31 C47 36 50 38 51 35 C52 31 50 28 49 25 Z"
        fill="url(#flameG)" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- inner flame -->
  <path d="M47 48 C49 55 53 60 51 68 C50 75 44 78 40 75 C36 72 37 66 40 62 C41 65 43 65 44 62 C45 57 44 53 47 48 Z"
        fill="url(#flameInner)"/>
</svg>
